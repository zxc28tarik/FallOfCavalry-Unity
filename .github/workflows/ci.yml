name: Foundation CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.103
      - name: Restore
        run: dotnet restore FallOfCavalry.sln
      - name: Compile
        run: dotnet build FallOfCavalry.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FallOfCavalry.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
